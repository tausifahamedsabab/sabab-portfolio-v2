<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="SalonBook device mockup (designed preview)">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#141722" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Device frame -->
  <rect x="0" y="0" width="720" height="460" rx="22" fill="#08090D" stroke="#141722" stroke-width="3"/>
  <circle cx="40" cy="24" r="4.5" fill="#334155"/>
  <circle cx="58" cy="24" r="4.5" fill="#22D3EE" opacity="0.8"/>
  <circle cx="76" cy="24" r="4.5" fill="#334155"/>
  <rect x="92" y="14" width="436" height="30" rx="15" fill="#141722" stroke="#22D3EE" stroke-width="1"/>
  <rect x="100" y="22" width="60" height="18" rx="9" fill="rgba(255,255,255,0.1)"/>
  <!-- URL bar text -->
  <text x="112" y="35" font-family="Geist Mono, monospace" font-size="10" fill="#475569">salonbook.app</text>
  <!-- Screen -->
  <rect x="2" y="34" width="716" height="420" rx="16" fill="#08090D" clip-path="inset(0,0,4px,0)"/>
  <rect x="18" y="42" width="684" height="396" rx="12" fill="#08090D"/>
  <!-- Top navbar -->
  <rect x="18" y="42" width="684" height="48" rx="0" fill="url(#g3)"/>
  <rect x="18" y="42" width="684" height="48" fill="none" stroke="#141722" stroke-width="1"/>
  <rect x="80" y="42" width="84" height="48" fill="none" stroke="#22D3EE" stroke-width="0.6" stroke-dasharray="4 4"/>
  <rect x="64" y="62" width="32" height="18" rx="9" fill="#141722" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="75" y="76" font-family="Geist Mono, monospace" font-size="11" fill="#22D3EE">SABAB.DEV</text>
  <!-- Main heading -->
  <text x="40" y="118" font-family="Geist, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Discover.<tspan fill="url(#g2)">Book</tspan>.Live</text>
  <text x="40" y="140" font-family="Geist, sans-serif" font-size="13" fill="#94A3B8">Salon &amp; beauty services across the city.</text>
  <!-- Hero status chips -->
  <circle cx="318" cy="158" r="10" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9">
    <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Service cards -->
  <rect x="40" y="175" width="220" height="110" rx="10" fill="url(#g3)" stroke="#141722" stroke-width="1"/>
  <rect x="240" y="175" width="220" height="110" rx="10" fill="url(#g3)" stroke="#141722" stroke-width="1"/>
  <rect x="40" y="195" width="180" height="36" rx="8" fill="#22D3EE" opacity="0.9"/>
  <text x="62" y="218" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#08090D">Hair Styling</text>
  <rect x="62" y="224" width="130" height="8" rx="4" fill="#334155"/>
  <text x="40" y="268" font-family="Geist, sans-serif" font-size="13" fill="#94A3B8">Wash, cut &amp; style</text>
  <text x="40" y="285" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">₹ 520</text>
  <text x="62" y="300" font-family="Geist, sans-serif" font-size="10" fill="#22D3EE">120 mins</text>
  <!-- Booking card -->
  <rect x="252" y="195" width="212" height="116" rx="10" fill="url(#g3)" stroke="#22D3EE" stroke-width="1" opacity="0.9">
    <rect x="252" y="195" width="212" height="116" rx="10" fill="none" stroke="url(#g2)" stroke-width="1"/>
  </rect>
  <text x="264" y="224" font-family="Geist, sans-serif" font-size="12" fill="#94A3B8">Book an appointment</text>
  <rect x="264" y="238" width="180" height="10" rx="5" fill="#1E293B"/>
  <circle cx="278" cy="243" r="5" fill="#22D3EE" opacity="0.7"/>
  <text x="288" y="248" font-family="Geist, sans-serif" font-size="11" fill="#94A3B8">Tue, 10:30 AM</text>
  <rect x="264" y="258" width="180" height="10" rx="5" fill="#1E293B"/>
  <circle cx="278" cy="263" r="5" fill="#22D3EE" opacity="0.7"/>
  <text x="288" y="268" font-family="Geist, sans-serif" font-size="11" fill="#94A3B8">Wed, 09:15 AM</text>
  <rect x="264" y="278" width="180" height="10" rx="5" fill="#1E293B"/>
  <circle cx="278" cy="283" r="5" fill="#8B5CF6" opacity="0.7"/>
  <text x="288" y="288" font-family="Geist, sans-serif" font-size="11" fill="#F8FAFC">Thu, 11:45 AM</text>
  <!-- Stats row -->
  <text x="40" y="330" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Appointment statuses</text>
  <rect x="40" y="345" width="140" height="24" rx="12" fill="#1E293B"/>
  <rect x="184" y="345" width="140" height="24" rx="12" fill="#2A3B3B"/>
  <rect x="328" y="345" width="140" height="24" rx="12" fill="#0F1D2C"/>
  <text x="54" y="360" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#22D3EE">Available</text>
  <text x="198" y="360" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">Pending</text>
  <text x="332" y="360" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#22D3EE">Confirmed</text>
  <!-- Admin card -->
  <rect x="40" y="375" width="280" height="70" rx="10" fill="url(#g3)" stroke="#141722" stroke-width="1"/>
  <text x="58" y="396" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Admin dashboard</text>
  <text x="58" y="414" font-family="Geist, sans-serif" font-size="12" fill="#94A3B8">Services • Appointments • Customers</text>
  <text x="40" y="300" font-family="Geist, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">R</text>
  <text x="60" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">e</text>
  <text x="80" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">s</text>
  <text x="100" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">e</text>
  <text x="120" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">r</text>
  <text x="140" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">v</text>
  <text x="160" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">i</text>
  <text x="180" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">c</text>
  <text x="200" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">e</text>
  <text x="220" y="300" font-family="Geist, sans-serif" font-size="13" fill="#F8FAFC">s</text>
  <rect x="40" y="300" width="132" height="3" fill="#8B5CF6"/>
</svg>
